# Tests, then a multi-arch image pushed to GitHub's Container registry
# (ghcr.io): a vX.Y.Z tag publishes x.y.z, x.y, x and latest; the dev branch
# publishes dev.
name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # nothing to cache: the module has no dependencies
      - run: make test

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The arm64 stage only copies files, so no emulation (QEMU) is needed.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Lowercases the image name, and labels the image with this repository
      # so the package is linked to it.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
