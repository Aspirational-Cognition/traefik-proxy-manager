# Tests, then a multi-arch image pushed to this project's registry: a vX.Y.Z
# tag publishes x.y.z, x.y, x and latest; the dev branch publishes dev.

stages:
  - test
  - build

test:
  stage: test
  tags: [docker, linux]
  image: golang:1.27-bookworm
  script:
    - make test

publish:
  stage: build
  tags: [docker, linux]
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        v=${CI_COMMIT_TAG#v}
        tags="$v ${v%.*} ${v%%.*} latest"
      else
        tags=dev
      fi
      args=$(printf -- " -t $CI_REGISTRY_IMAGE:%s" $tags)
    # The arm64 stage only copies files, so no emulation is needed.
    - docker buildx create --use --driver docker-container
    - docker buildx build --platform linux/amd64,linux/arm64 $args --push .
