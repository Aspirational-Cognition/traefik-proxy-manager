# Tests, then a multi-arch image pushed to this project's registry: a vX.Y.Z
# tag publishes x.y.z, x.y, x and latest; the dev branch publishes dev.
# The docker runner is a shell executor, so jobs use the host's Docker.

stages:
  - test
  - build

test:
  stage: test
  tags: [docker, linux]
  script:
    - docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src golang:1.27-bookworm make test

publish:
  stage: build
  tags: [docker, linux]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        v=${CI_COMMIT_TAG#v}
        tags="$v ${v%.*} ${v%%.*} latest"
      else
        tags=dev
      fi
      args=$(printf -- " -t $CI_REGISTRY_IMAGE:%s" $tags)
    # A fresh builder per job, so no other job on the shared host can poison
    # its cache. The arm64 stage only copies files, so no emulation is needed.
    - docker buildx create --name "tpm-$CI_JOB_ID" --driver docker-container
    - docker buildx build --builder "tpm-$CI_JOB_ID" --platform linux/amd64,linux/arm64 $args --push .
  after_script:
    - docker buildx rm -f "tpm-$CI_JOB_ID"
